<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10171F"/>
      <stop offset="1" stop-color="#0E141C"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#5E7186" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <pattern id="gridFine" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M8 0H0V8" fill="none" stroke="#5E7186" stroke-opacity="0.04" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Blueprint field -->
  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#gridFine)"/>
  <rect width="1200" height="360" fill="url(#grid)"/>

  <!-- Frame + corner ticks -->
  <rect x="20" y="20" width="1160" height="320" fill="none" stroke="#2E4054" stroke-width="1"/>
  <g stroke="#E8A33D" stroke-width="1.5">
    <path d="M20 44V20H44"/><path d="M1156 20H1180V44"/>
    <path d="M20 316V340H44"/><path d="M1156 340H1180V316"/>
  </g>

  <!-- Car side schematic (amber outline, blueprint style) -->
  <g transform="translate(690,120)" fill="none" stroke="#E8A33D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- body -->
    <path d="M20 96 L44 96 M56 96 L200 96 M212 96 L392 96 M404 96 L420 96"/>
    <path d="M8 96 L8 74 L40 74 L78 40 L250 40 L320 74 L420 74 L432 82 L432 96"/>
    <path d="M40 74 L78 40 M250 40 L320 74"/>
    <!-- roof/window divider -->
    <path d="M170 40 L170 74 M78 74 L420 74" stroke-opacity="0.6"/>
    <!-- wheels -->
    <circle cx="120" cy="96" r="26"/><circle cx="120" cy="96" r="10"/>
    <circle cx="336" cy="96" r="26"/><circle cx="336" cy="96" r="10"/>
    <!-- dimension line -->
    <path d="M8 132 L432 132" stroke="#5A8DC8" stroke-opacity="0.5" stroke-width="1"/>
    <path d="M8 126 L8 138 M432 126 L432 138" stroke="#5A8DC8" stroke-opacity="0.5" stroke-width="1"/>
  </g>
  <text x="906" y="270" fill="#5A8DC8" fill-opacity="0.6" font-size="12" text-anchor="middle" letter-spacing="2">FIG. 01 — DAILY DRIVER</text>

  <!-- Wordmark -->
  <text x="72" y="150" fill="#D9E2EC" font-size="66" font-weight="700" letter-spacing="1">CARS<tspan fill="#E8A33D"> MANAGER</tspan></text>
  <text x="74" y="188" fill="#5E7186" font-size="19" letter-spacing="4">FUEL · COSTS · MAINTENANCE — MEASURED, NOT GUESSED</text>

  <!-- Spec strip -->
  <g font-size="13" letter-spacing="1">
    <rect x="74" y="228" width="132" height="30" fill="none" stroke="#22303F"/>
    <text x="140" y="248" fill="#58B573" text-anchor="middle">◆ PWA · OFFLINE</text>
    <rect x="216" y="228" width="150" height="30" fill="none" stroke="#22303F"/>
    <text x="291" y="248" fill="#5A8DC8" text-anchor="middle">◆ ZERO-BUILD ESM</text>
    <rect x="376" y="228" width="132" height="30" fill="none" stroke="#22303F"/>
    <text x="442" y="248" fill="#E8A33D" text-anchor="middle">◆ SUPABASE</text>
  </g>
</svg>
