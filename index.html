<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0E141C">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Cars">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <title>Cars Manager</title>

  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">

  <!-- Chart.js (UMD — accessed as window.Chart in ES modules) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>
</head>
<!-- `signed-out` until main.js confirms a session: no nav/FAB flash before the login gate. -->
<body class="signed-out">

  <!-- Main content area -->
  <main id="main">
    <div id="app">
      <div class="center-screen" style="min-height:90dvh">
        <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#E8A33D" stroke-width="1.2" stroke-linecap="round">
          <path d="M7 17m-2 0a2 2 0 1 0 4 0a2 2 0 1 0-4 0M17 17m-2 0a2 2 0 1 0 4 0a2 2 0 1 0-4 0"/>
          <path d="M5 17H3V11L5 6H19L21 11V17H19M9 17H15M9 11H19M9 11H5"/>
        </svg>
        <p class="micro" style="margin-top:14px">Loading Cars Manager</p>
      </div>
    </div>
  </main>

  <!-- Bottom Navigation -->
  <nav id="nav">
    <div class="nav-row">
      <button class="nav-btn" data-hash="#dashboard">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>Dash</span>
      </button>
      <button class="nav-btn" data-hash="#fuel">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round"><path d="M3 22V9l5-7h8l5 7v13H3z"/><path d="M3 9h18"/><path d="M9 22V12h6v10"/></svg>
        <span>Fuel</span>
      </button>
      <button class="nav-btn" data-hash="#costs">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round"><path d="M12 1v22M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>
        <span>Costs</span>
      </button>
      <button class="nav-btn" data-hash="#additional">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round"><path d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.77-3.77a6 6 0 01-7.94 7.94l-6.91 6.91a2.12 2.12 0 01-3-3l6.91-6.91a6 6 0 017.94-7.94l-3.76 3.76z"/></svg>
        <span>Service</span>
      </button>
      <button class="nav-btn" data-hash="#settings">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09a1.65 1.65 0 00-1-1.51 1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09a1.65 1.65 0 001.51-1 1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33h0a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51h0a1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82v0a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
        <span>Settings</span>
      </button>
    </div>
  </nav>

  <!-- Floating Action Button -->
  <button id="fab" onclick="window.__openAddModal && window.__openAddModal()" aria-label="Add entry">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
      <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
    </svg>
  </button>

  <!-- Modal overlay -->
  <div id="modal" class="hidden" onclick="if(event.target===this)window.__closeModal&&window.__closeModal()">
    <div id="modal-sheet">
      <div id="modal-body"></div>
    </div>
  </div>

  <!-- Toast container -->
  <div id="toasts"></div>

  <script type="module" src="/js/main.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(() => {})
    }
  </script>
</body>
</html>
